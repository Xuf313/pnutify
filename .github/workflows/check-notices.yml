name: Check for new PNU notices

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the push-check endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://${{ secrets.APP_DOMAIN }}/api/push/send"
