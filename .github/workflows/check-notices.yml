name: Check for new PNU notices (backup)

# Backup trigger only. GitHub delays scheduled runs (often 10–60 min) and turns
# them off after 60 days without repo activity, so set up an Upstash QStash or
# cron-job.org schedule as the main trigger (see README). Running both is safe:
# the endpoint takes a lock and never sends the same alert twice.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

concurrency:
  group: check-notices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit the push-check endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 70 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://${APP_DOMAIN}/api/push/send"
